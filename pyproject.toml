[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-boundary-lab"
version = "0.1.0"
description = "Local-first lab: untrusted tool plans meet a deterministic execution boundary"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]

[project.scripts]
agentlab = "agentlab.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/agentlab"]

[tool.hatch.build.targets.wheel.sources]
"src/agentlab" = "agentlab"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
